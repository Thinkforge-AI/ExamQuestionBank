<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>司律考題練習題庫系統</title>
    <!-- Apply the saved theme before first paint so the page never flashes the wrong mode.
         Keep in sync with src/composables/useTheme.js -->
    <script>
        (function () {
            var mode = 'system';
            try { mode = localStorage.getItem('theme') || 'system'; } catch (e) { }
            var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var root = document.documentElement;
            if (dark) root.classList.add('dark');
            root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
        // Handle redirect from 404.html for SPA routing
        (function () {
            var params = new URLSearchParams(window.location.search);
            var path = params.get('p');
            if (path) {
                var query = params.get('q') || '';
                var newUrl = path + query + window.location.hash;
                window.history.replaceState(null, '', newUrl);
            }
        })();
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
